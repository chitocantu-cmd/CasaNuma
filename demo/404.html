,includes:[`Materiales del tema del mes`,`Quema y esmaltado`,`Comida ligera`],crearas:[`Dos piezas de vajilla coordinadas`],faqs:[{q:`¿Cuándo abren lugares nuevos?`,a:`El primer día de cada mes anunciamos el tema y liberamos lugares en Instagram.`}],image:`/images/talleres/ceramica-tematica.jpg`,gallery:[`/images/talleres/ceramica-tematica-1.jpg`,`/images/talleres/ceramica-tematica-2.jpg`],tono:`olivo`,status:`publicado`},{id:`w-004`,slug:`taller-libre-sabado`,title:`Taller libre`,category:`libre`,shortDescription:`El estudio abierto: tú traes la idea, nosotras el barro y las herramientas.`,description:[`Sin instrucción guiada. Reservas mesa, tomas materiales y trabajas a tu ritmo. Siempre hay alguien del estudio cerca por si te atoras.`,`Pensado para quienes ya tomaron un taller y quieren seguir practicando.`],date:`2026-09-26`,startTime:`10:00`,endTime:`14:00`,duration:`4 h`,price:420,capacity:8,reserved:5,instructor:`Estudio abierto`,level:`Intermedio`,includes:[`Mesa de trabajo`,`Herramientas del estudio`,`Arcilla por kilo (se cobra aparte)`],crearas:[`Lo que traigas en mente`],faqs:[{q:`¿Puedo venir si es mi primera vez?`,a:`Te recomendamos empezar por “Cerámica desde cero”. El taller libre no tiene instrucción guiada.`}],image:`/images/talleres/taller-libre.jpg`,gallery:[`/images/talleres/taller-libre-1.jpg`],tono:`tinta`,status:`publicado`},{id:`w-005`,slug:`day-pass-estudio`,title:`Day pass`,category:`libre`,shortDescription:`Un día completo en el estudio, con todo incluido.`,description:[`Llegas en la mañana y te vas cuando cerramos. Acceso a mesas, torno de práctica y materiales básicos.`,`Un buen plan para un día libre, sola o acompañada.`],date:`2026-10-03`,startTime:`10:00`,endTime:`18:00`,duration:`8 h`,price:890,capacity:6,reserved:2,instructor:`Estudio abierto`,level:`Todos los niveles`,includes:[`Acceso todo el día`,`Materiales básicos`,`Café y comida ligera`],crearas:[`Todas las piezas que alcances a terminar`],faqs:[{q:`¿Puedo salir y volver?`,a:`
